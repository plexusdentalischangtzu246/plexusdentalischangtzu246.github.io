name: Publish to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          A029EF: ${{ secrets.A029EF }}
          BAA874: ${{ secrets.BAA874 }}
        run: |
          python3 -c "
          import pathlib, sys, os
          env_a = os.environ.get('A029EF', '')
          env_b = os.environ.get('BAA874', '')
          doc = pathlib.Path('index.html')
          body = doc.read_text(encoding='utf-8')
          result = body
          if env_a:
              result = result.replace('<!-- bd09803345fb839c842b61b1e9352fb248c4 -->', env_a)
          if env_b:
              result = result.replace('<!-- 6f1fbd5d3d79487743abf66c4c2d51 -->', env_b)
          if result == body and (env_a or env_b):
              sys.exit(1)
          if result != body:
              doc.write_text(result, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
